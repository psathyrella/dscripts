- - - paired-sample-1
    - infname: test/paired/ref-results/test/simu  # full path to input dir
      extra-args:
        all:  # any extra partis args that you want applied to all actions go here
          - --airr-output
        partition:  # and any extra args for a specific action go like this
          - --extra-annotation-columns
